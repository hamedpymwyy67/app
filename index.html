<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hami Artan Trading Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-gradient: linear-gradient(135deg, #f39c12, #d4af37);
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --green-status: #2e7d32;
            --red-alert: #c62828;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            font-family: Tahoma, 'Segoe UI', Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
            direction: rtl;
        }

        .header-card {
            background: linear-gradient(145deg, #1e1e1e, #2a2a2a);
            border: 1px solid var(--gold-primary);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15);
            margin-bottom: 12px;
        }

        h1 {
            color: var(--gold-primary);
            font-size: 18px;
            margin: 0 0 5px 0;
        }

        .sub-title {
            font-size: 11px;
            color: #888;
            margin-bottom: 10px;
        }

        .status-badge {
            display: inline-block;
            background-color: var(--green-status);
            color: #fff;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        /* بخش آمار حساب */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .stat-box {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        .stat-title {
            font-size: 11px;
            color: #aaa;
        }

        .stat-value {
            font-size: 14px;
            font-weight: bold;
            color: var(--gold-primary);
            margin-top: 4px;
        }

        /* چارت زنده */
        .chart-container {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
            height: 350px;
            margin-bottom: 12px;
        }

        /* دکمه‌های معاملات و فرمان */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .btn-trade {
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            color: #fff;
            cursor: pointer;
        }

        .btn-buy { background-color: #2e7d32; }
        .btn-sell { background-color: #c62828; }

        .btn-full {
            width: 100%;
            background: var(--gold-gradient);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 12px;
        }

        /* بخش سیگنال‌ها و تحلیل */
        .info-card {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px;
            font-size: 12px;
            line-height: 1.6;
        }

        .info-card h3 {
            color: var(--gold-primary);
            font-size: 14px;
            margin: 0 0 8px 0;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
    </style>
</head>
<body>

    <!-- هدر اصلی -->
    <div class="header-card">
        <h1>🏛️ داشبورد معاملاتی حامی آرتان</h1>
        <div class="sub-title">Hami Artan Pro Trading Ecosystem</div>
        <div class="status-badge">🟢 متاتریدر ۵ متصل است</div>
    </div>

    <!-- آمار و وضعیت حساب -->
    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-title">نماد فعال</div>
            <div class="stat-value">XAUUSD (طلا)</div>
        </div>
        <div class="stat-box">
            <div class="stat-title">مدیریت ریسک</div>
            <div class="stat-value" style="color: #4caf50;">Kill-Switch OK</div>
        </div>
    </div>

    <!-- چارت زنده طلا -->
    <div class="chart-container">
        <!-- TradingView Widget BEGIN -->
        <div class="tradingview-widget-container" style="height:100%;width:100%">
          <div id="tradingview_xau" style="height:calc(100% - 32px);width:100%"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
          <script type="text/javascript">
          new TradingView.widget(
          {
          "autosize": true,
          "symbol": "OANDA:XAUUSD",
          "interval": "15",
          "timezone": "Etc/UTC",
          "theme": "dark",
          "style": "1",
          "locale": "en",
          "toolbar_bg": "#f1f3f6",
          "enable_publishing": false,
          "hide_top_toolbar": false,
          "save_image": false,
          "container_id": "tradingview_xau"
        }
          );
          </script>
        </div>
        <!-- TradingView Widget END -->
    </div>

    <!-- دکمه‌های عملیاتی -->
    <div class="action-grid">
        <button class="btn-trade btn-buy" onclick="alert('دستور خرید ارسال شد')">📈 ثبت خرید (BUY)</button>
        <button class="btn-trade btn-sell" onclick="alert('دستور فروش ارسال شد')">📉 ثبت فروش (SELL)</button>
    </div>

    <!-- تحلیل و هشدار استراتژی -->
    <div class="info-card">
        <h3>⚡ وضعیت اکسپرت و تحلیل زنده</h3>
        <p>• <strong>اکسپرت فعال:</strong> HamiArtanBridge.mq5</p>
        <p>• <strong>استراتژی:</strong> SMC + روند چارت ۱۵ دقیقه</p>
        <p>• <strong>هشدار:</strong> خروج اضطراری در صورت تغییر روند فعال است.</p>
    </div>

    <button class="btn-full" style="margin-top: 12px;" onclick="Telegram.WebApp.close()">بستن داشبورد</button>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
    </script>
</body>
</html>
